name: HSM Simulator Setup & Testing

on:
  push:
    branches: [ master, main, develop ]
    paths:
      - 'src/hsm_client.rs'
      - 'tests/hsm_simulator/**'
      - '.github/workflows/hsm-setup.yml'
      - 'Cargo.toml'
  pull_request:
    branches: [ master, main, develop ]

jobs:
  hsm-simulator:
    name: HSM Simulator (PKCS#11 Mock)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.70

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install SoftHSM (PKCS#11 simulator)
        run: |
          sudo apt-get update
          sudo apt-get install -y softhsm2 libsofthsm2 libsofthsm2-dev
          softhsm2-util --version

      - name: Initialize SoftHSM token
        run: |
          mkdir -p ~/.softhsm2
          softhsm2-util --init-token --slot 0 --label "GeometryDash" --so-pin 1234 --pin 5678
          softhsm2-util --show-slots

      - name: Generate test key pair (Ed25519)
        run: |
          # Generate Ed25519 key pair in HSM
          # Note: SoftHSM supports RSA/ECDSA; Ed25519 support added in later versions
          # For now, use ECDSA P-256 as test proxy (Week 1.5 will finalize)
          echo "SoftHSM initialized with token 'GeometryDash' on slot 0"
          echo "PIN: 5678"

      - name: Build HSM client library
        run: cargo build --lib --features hsm-test
        env:
          SOFTHSM2_MODULE: /usr/lib/softhsm/libsofthsm2.so
          SOFTHSM_PIN: "5678"

      - name: Run HSM simulator tests
        run: |
          cargo test --test hsm_simulator_test -- --nocapture --test-threads=1
        env:
          SOFTHSM2_MODULE: /usr/lib/softhsm/libsofthsm2.so
          SOFTHSM_PIN: "5678"
          RUST_BACKTRACE: 1

      - name: Generate test artifacts
        run: |
          echo "HSM simulator tests passed"
          echo "PKCS#11 interface validated"
          echo "Ready for Week 1.5 HSM client implementation"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: hsm-test-results
          path: target/debug/deps/hsm_simulator_test-*.d

  rust-build:
    name: Rust Build & Clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.70
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt -- --check

      - name: Clippy lints
        run: cargo clippy --all --all-targets -- -D warnings

      - name: Build release
        run: cargo build --release

  tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.70

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run all tests
        run: cargo test --all --verbose

      - name: Run doc tests
        run: cargo test --doc

      - name: Coverage (optional, Week 9-10)
        run: |
          echo "Code coverage tracking starts in Week 9-10"
          echo "Target: >95% coverage for Phase 2 modules"
