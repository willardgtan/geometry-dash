[package]
name = "geometry-dash"
version = "0.1.0"
edition = "2021"
authors = ["Geometry Dash Phase 2 Team"]
description = "Multi-principal security system for Geometry Dash (Phase 2 Implementation)"
license = "Proprietary"

[dependencies]
# Cryptography
sodiumoxide = "0.2"           # Secure-by-default crypto (libsodium wrapper)
sha2 = "0.10"                 # SHA-256 for artifact hashing

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"            # JSON serialization for provenance artifacts
jsonschema = "0.17"           # JSON schema validation

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Logging & debugging
log = "0.4"
env_logger = "0.11"

# System/OS interfaces
libc = "0.2"                  # Unix syscalls, ptrace prevention
nix = { version = "0.27", features = ["process", "signal", "fs"] }  # Higher-level Unix bindings

# UUID generation
uuid = { version = "1.6", features = ["v4", "serde"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Configuration
config = "0.13"
yaml-rust = "0.4"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# HSM/PKCS#11 (deferred to Week 1.5)
# pkcs11 = "0.5"              # PKCS#11 bindings (optional, enable in Week 1.5)

# Testing utilities
proptest = "1.4"              # Property-based testing for adversarial tests
tempfile = "3.8"              # Temporary files for testing

[dev-dependencies]
mockall = "0.12"              # Mock generation for unit tests
tokio-test = "0.4"            # Tokio test utilities
rand = "0.8"                  # Random number generation for test vectors

[[bin]]
name = "supervisor"
path = "src/bin/supervisor.rs"

[[bin]]
name = "policy"
path = "src/bin/policy.rs"

[[bin]]
name = "actuator"
path = "src/bin/actuator.rs"

[[bin]]
name = "audit"
path = "src/bin/audit.rs"

[[bin]]
name = "sealer"
path = "src/bin/sealer.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0

# Security-focused compiler flags
[build]
rustflags = ["-C", "overflow-checks=on"]
